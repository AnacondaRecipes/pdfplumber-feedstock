{% set name = "pdfplumber" %}
{% set version = "0.11.6" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pdfplumber-{{ version }}.tar.gz
  sha256: d0f419e031641d9eac70dc18c60e1fc3ca2ec28cce7e149644923c030a0003ff

build:
  number: 0
  entry_points:
    - pdfplumber = pdfplumber.cli:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - setuptools
    - python
  run:
    - pdfminer.six
    - pypdfium2
    - pillow
    - python
    - wand 

test:
  imports:
    - pdfplumber
  commands:
    - pip check
    - pdfplumber --help
  requires:
    - pip
    - setuptools
    - python 

about:
  home: https://github.com/jsvine/pdfplumber
  summary: Plumb a PDF for detailed information about each char, rectangle, and line.
  license: MIT
  license_file: LICENSE.txt
  dev_url: https://github.com/jsvine/pdfplumber
  doc_url: https://github.com/jsvine/pdfplumber/tree/stable/docs

extra:
  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/78379
    reason: Client request
  recipe-maintainers:
    - ianaobi
    - bkreider
  recipe-maintainers:
    - melonhead901
